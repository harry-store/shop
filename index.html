<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Build Brand - จัดการสต็อกสินค้าและวัตถุดิบ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --pri:#1d75bb;--pri2:#155a96;--pri-l:#dbeafe;
  --grn:#16a34a;--grn-l:#dcfce7;
  --red:#dc2626;--red-l:#fee2e2;
  --amb:#d97706;--amb-l:#fef3c7;
  --bg:#f1f5f9;--card:#fff;
  --border:#e2e8f0;--border2:#cbd5e1;
  --txt:#0f172a;--txt2:#475569;--txt3:#94a3b8;
  --nav:60px;--hd:54px;
  --rad:12px;--rad2:16px;
}
*{box-sizing:border-box;font-family:'Sarabun',sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-size:16px;overflow-x:hidden;min-height:100vh}
input,select,textarea{font-family:'Sarabun',sans-serif}
img{display:block}
button{cursor:pointer;font-family:'Sarabun',sans-serif}

/* LOADER */
#loader{position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:9000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.spin{width:40px;height:40px;border:3px solid var(--border2);border-top-color:var(--pri);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{color:var(--txt2);font-size:14px;font-weight:500}

/* LOGIN */
#login-screen{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px;flex-direction:column;background:linear-gradient(135deg,#155a96 0%,#1d75bb 100%)}
#login-screen.show{display:flex}
.login-card{background:#fff;border-radius:24px;padding:36px 24px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.app-logo{width:150px;height:150px;background:var(--pri);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.login-card h1{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.login-sub{font-size:14px;color:var(--txt2);text-align:center;margin-bottom:24px}
.iw{margin-bottom:14px}
.iw label{display:block;font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.iw input{width:100%;padding:13px 16px;border:2px solid var(--border);border-radius:var(--rad);font-size:17px;color:var(--txt);background:#fff;outline:none;transition:border-color .15s}
.iw input:focus{border-color:var(--pri)}
.btn-login{width:100%;padding:14px;background:var(--pri);color:#fff;border:none;border-radius:var(--rad);font-size:16px;font-weight:700;transition:background .15s}
.btn-login:active{background:var(--pri2)}

/* APP */
#app{display:none}
#app.show{display:block}

/* HEADER */
.hd{position:sticky;top:0;height:var(--hd);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;z-index:100;gap:10px}
.hd-brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.store-av{width:36px;height:36px;border-radius:10px;background:var(--pri);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.store-av img{width:100%;height:100%;object-fit:cover}
.store-av span{color:#fff;font-weight:700;font-size:15px}
.hd-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-btn{width:38px;height:38px;border:none;background:var(--bg);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--txt2)}
.expire-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;display:none}
.expire-badge.ok{background:var(--grn-l);color:var(--grn);display:inline}
.expire-badge.warn{background:var(--amb-l);color:var(--amb);display:inline}
.expire-badge.crit{background:var(--red-l);color:var(--red);display:inline}

/* PAGES */
.page{padding:14px 14px calc(var(--nav) + 20px);display:none}
.page.active{display:block}

/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav);background:#fff;border-top:1px solid var(--border);display:flex;z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--txt3);font-size:11px;font-weight:600;border:none;background:none}
.nav-item.on{color:var(--pri)}
.nav-icon{font-size:22px;line-height:1}
.nav-bar{height:3px;width:28px;border-radius:2px;background:transparent;margin-top:1px}
.nav-item.on .nav-bar{background:var(--pri)}

/* FAB */
.fab{position:fixed;bottom:calc(var(--nav) + 16px);right:16px;width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;border:none;font-size:28px;box-shadow:0 6px 20px rgba(29,78,216,.4);z-index:110;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.91)}

/* STAT CARDS */
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:var(--rad2);padding:14px 16px;border:1px solid var(--border);position:relative;overflow:hidden;cursor:pointer}
.stat.sel{box-shadow:0 0 0 2px var(--pri)}
.stat::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:3px 3px 0 0}
.stat.in::after{background:var(--grn)}
.stat.out::after{background:var(--red)}
.stat-lbl{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.stat-num{font-size:30px;font-weight:700;line-height:1}
.stat.in .stat-num{color:var(--grn)}
.stat.out .stat-num{color:var(--red)}
.stat-sub{font-size:11px;color:var(--txt3);margin-top:4px}

/* FILTER */
.filter-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.filter-bar select,.filter-bar input[type=date]{flex:1;padding:9px 10px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;background:#fff;color:var(--txt);outline:none;font-family:'Sarabun',sans-serif}
.filter-bar select:focus,.filter-bar input[type=date]:focus{border-color:var(--pri)}
.btn-reset{padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-size:13px;color:var(--txt2);white-space:nowrap}

/* LOG */
.sec-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-hd h3{font-size:15px;font-weight:700}
.sec-hd span{font-size:12px;color:var(--txt3)}
.log-item{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.log-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.log-ic.in{background:var(--grn-l)}
.log-ic.out{background:var(--red-l)}
.log-body{flex:1;min-width:0}
.log-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-meta{font-size:12px;color:var(--txt2);margin-top:2px}
.log-right{text-align:right;flex-shrink:0}
.log-qty{font-size:17px;font-weight:700}
.log-qty.in{color:var(--grn)}
.log-qty.out{color:var(--red)}
.log-price{font-size:11px;color:var(--txt3);margin-top:2px}
.empty{text-align:center;padding:48px 20px}
.empty-ic{font-size:48px;opacity:.4;margin-bottom:12px}
.empty p{font-size:15px;color:var(--txt3)}

/* DASHBOARD */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.dash-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rad2);padding:14px 16px}
.dash-card h4{font-size:11px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.dash-big{font-size:24px;font-weight:700}
.dash-sub{font-size:11px;color:var(--txt3);margin-top:3px}
.c-grn{color:var(--grn)}.c-red{color:var(--red)}.c-pri{color:var(--pri)}
.stock-row{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:11px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.stock-thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;background:var(--bg);border:1px solid var(--border);flex-shrink:0}
.sbw{flex:1;min-width:0}
.sbl{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px}
.sbb{height:7px;background:var(--bg);border-radius:4px;overflow:hidden}
.sbf{height:100%;border-radius:4px}
.suggest-row{background:var(--amb-l);border:1px solid #fde68a;border-radius:var(--rad);padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}

/* SETTINGS PANEL */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none}
#overlay.show{display:block}
#settings{position:fixed;top:0;right:-100%;bottom:0;width:min(85vw,360px);background:#fff;z-index:300;transition:right .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;display:flex;flex-direction:column}
#settings.show{right:0}
.set-hd{position:sticky;top:0;background:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);z-index:10}
.set-hd h2{flex:1;font-size:17px;font-weight:700}
.set-close{width:34px;height:34px;border:none;background:var(--bg);border-radius:9px;font-size:18px;color:var(--txt2)}
.set-body{padding:16px;flex:1}
.set-sec-title{font-size:12px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-row-l{font-size:15px;font-weight:500}
.set-row-sub{font-size:12px;color:var(--txt3);margin-top:2px}
.prod-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rad);padding:10px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.prod-thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;background:#fff;border:1px solid var(--border);flex-shrink:0}
.prod-info{flex:1;min-width:0}
.prod-nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-sub-txt{font-size:12px;color:var(--txt2);margin-top:1px}

/* ===== CUSTOM MODAL ===== */
.modal-wrap{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:16px}
.modal-wrap.show{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.modal-box{position:relative;background:#fff;border-radius:20px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;padding:0;animation:popIn .22s ease}
@keyframes popIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-hd{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-hd h3{font-size:17px;font-weight:700}
.modal-close{width:32px;height:32px;border:none;background:var(--bg);border-radius:8px;font-size:18px;color:var(--txt2);display:flex;align-items:center;justify-content:center}
.modal-body{padding:16px 20px}
.modal-footer{padding:12px 20px 24px;display:flex;gap:10px}
.modal-footer button{flex:1;padding:13px;border-radius:12px;border:none;font-size:16px;font-weight:700}
.btn-cancel{background:var(--bg);color:var(--txt2)}
.btn-confirm{background:var(--pri);color:#fff}
.btn-del{background:var(--red-l);color:var(--red)}

/* FORM ELEMENTS */
.fl{display:block;font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.fi{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;color:var(--txt);background:#fff;outline:none;margin-bottom:14px;display:block}
.fi:focus{border-color:var(--pri)}
.fi-file{padding:10px 14px;font-size:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f2 .fi{width:100%}
.prod-prev-img{width:72px;height:72px;border-radius:12px;object-fit:cover;background:var(--bg);border:1px solid var(--border);display:block;margin:0 auto 12px}
select.fi {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg fill='%23475569' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
  background-repeat: no-repeat;
  background-position: right 14px center;
  background-size: 16px;
  padding-right: 40px;
}

/* TOAST */
.toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#1e293b;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:500;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
.toast.ok{background:#15803d}
.toast.err{background:#dc2626}
.toast.warn{background:#d97706}

/* CONFIRM & ALERT */
.confirm-wrap,.alert-wrap{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:20px}
.confirm-wrap.show,.alert-wrap.show{display:flex}
.confirm-bg,.alert-bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.confirm-box,.alert-box{position:relative;background:#fff;border-radius:20px;padding:24px 20px;width:100%;max-width:320px;text-align:center}
.confirm-icon,.alert-icon{font-size:40px;margin-bottom:12px}
.confirm-box h3,.alert-box h3{font-size:17px;font-weight:700;margin-bottom:8px}
.confirm-box p,.alert-box p{font-size:14px;color:var(--txt2);margin-bottom:20px;line-height:1.5}
.confirm-btns{display:flex;gap:10px}
.confirm-btns button,.alert-box button{flex:1;padding:12px;border-radius:12px;border:none;font-size:16px;font-weight:700}

/* MISC */
.btn-sm{padding:7px 14px;border-radius:9px;border:none;font-size:13px;font-weight:600}
.btn-pri{background:var(--pri);color:#fff}
.btn-grn{background:var(--grn);color:#fff}
.btn-ghost{background:var(--bg);color:var(--txt2);border:1px solid var(--border)}
</style>
</head>
<body>

<div id="loader"><div class="spin"></div><p id="loader-txt">กำลังโหลด...</p></div>

<div class="toast-wrap"><div id="toast" class="toast"></div></div>

<div id="alert-wrap" class="alert-wrap">
  <div class="alert-bg" onclick="closeAlert()"></div>
  <div class="alert-box">
    <div id="alert-icon" class="alert-icon"></div>
    <h3 id="alert-title"></h3>
    <p id="alert-msg"></p>
    <div style="display:flex; gap:10px;">
      <button onclick="doLogout()" style="background:var(--bg); color:var(--txt2); font-weight:600;" id="alert-logout-btn">ออกจากระบบ</button>
      <button onclick="closeAlert()" id="alert-btn" style="background:var(--pri); color:#fff;">ตกลง</button>
    </div>
  </div>
</div>

<div id="confirm-wrap" class="confirm-wrap">
  <div class="confirm-bg"></div>
  <div class="confirm-box">
    <div id="confirm-icon" class="confirm-icon"></div>
    <h3 id="confirm-title"></h3>
    <p id="confirm-msg"></p>
    <div class="confirm-btns">
      <button id="confirm-cancel" class="btn-cancel" onclick="closeConfirm(false)">ยกเลิก</button>
      <button id="confirm-ok" onclick="closeConfirm(true)">ยืนยัน</button>
    </div>
  </div>
</div>

<div id="modal-wrap" class="modal-wrap">
  <div class="modal-bg" onclick="closeModal()"></div>
  <div class="modal-box">
    <div class="modal-hd">
      <h3 id="modal-title">Modal</h3>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- ════════ LOGIN SCREEN ════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="app-logo" style="background:transparent; padding:0;">
      <img src="https://drive.google.com/thumbnail?id=13z-FagvA7V1BjXj4uO2sCRQRAw5lGRVU&sz=w400" style="width:100%;height:100%;object-fit:cover;border-radius:18px;">
    </div>
    <h1>Build Brand</h1>
    <p class="login-sub">ระบบจัดการสต็อกวัตถุดิบและสินค้า</p>
    
    <div class="iw" id="phone-wrapper">
      <label>เบอร์โทรศัพท์</label>
      <input type="tel" id="inp-phone" maxlength="10" placeholder="0XX-XXX-XXXX" inputmode="numeric">
    </div>
    
    <div class="iw" id="pw-wrapper" style="display:none; margin-top:12px;">
      <label id="lbl-pw">รหัสผ่านสำหรับเข้าสู่ระบบ</label>
      <input type="password" id="inp-pw" placeholder="กรอกรหัสผ่านของคุณ">
      <p id="login-status-msg" style="font-size:12px; color:var(--amb); margin-top:6px; font-weight:500;"></p>
    </div>
    
    <button class="btn-login" id="btn-login-action" onclick="doLogin()" style="margin-top:14px;">ถัดไป</button>
  </div>
</div>

<!-- ════════ MAIN APP SCREEN ════════ -->
<div id="app">
  <div class="hd">
    <div class="hd-brand">
      <div class="store-av" id="store-av"><span id="store-init">S</span></div>
      <div class="hd-name" id="store-name">ร้านค้า</div>
    </div>
    <div id="expire-badge" class="expire-badge"></div>
    <button class="hd-btn" onclick="openSettings()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54A.484.484 0 0 0 14 2h-4a.484.484 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h4c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>
  </div>

  <!-- Page 1: Stock Transactions -->
  <div id="page-stock" class="page active">
    <div class="stats-row">
      <div class="stat in" id="stat-in" onclick="filterByType('IN')">
        <div class="stat-lbl" id="lbl-in">รับเข้าวันนี้</div>
        <div class="stat-num" id="sum-in">0</div>
        <div class="stat-sub">รายการ</div>
      </div>
      <div class="stat out" id="stat-out" onclick="filterByType('OUT')">
        <div class="stat-lbl" id="lbl-out">เบิกออกวันนี้</div>
        <div class="stat-num" id="sum-out">0</div>
        <div class="stat-sub">รายการ</div>
      </div>
    </div>
    <div class="filter-bar">
      <select id="f-type" onchange="applyFilter()">
        <option value="ALL">ทุกประเภท</option>
        <option value="IN">รับเข้า</option>
        <option value="OUT">เบิกออก</option>
      </select>
      <input type="date" id="f-date" onchange="applyFilter()">
      <button class="btn-reset" onclick="clearFilter()">รีเซ็ต</button>
    </div>
    <div class="sec-hd">
      <h3>ประวัติรายการ</h3>
      <span id="log-count"></span>
    </div>
    <div id="log-list"></div>
  </div>

  <!-- Page 2: Dashboard Analytics -->
  <div id="page-dash" class="page">
    <div class="filter-bar">
      <select id="d-range" onchange="applyDashFilter()">
        <option value="thismonth">เดือนนี้</option>
        <option value="today">วันนี้</option>

<script>
/* ====================================================
   CONFIGURATION & DUAL-ENGINE API CLIENT
   (Works on GitHub Pages & Google Apps Script Web App)
==================================================== */
// ใส่ URL ของ Google Apps Script Web App ที่ Deploy แล้วที่นี่ (สำหรับการรันบน GitHub Pages / Localhost)
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzlfVhF7P9_pUB4ShIjfpmJCVpaGpnfpp2EhHIhJJqpdAYTr-_qmbbA0o5MKLLjl0A/exec";

// Global State
const S = {
  idshop: '', phone: '', password: '', active: false, daysLeft: 0, expireStr: '',
  prods: [], logs: [], staff: [],
  filterType: 'ALL', filterDate: '',
  blockUI: false,
  dashCache: null
};

// Check if running inside native Google Apps Script HtmlService
const isGASNative = (typeof google !== 'undefined' && google.script && google.script.run && window.location.hostname.includes('google'));

async function apiCall(action, payload = {}, method = 'POST') {
  if (isGASNative) {
    return new Promise((resolve, reject) => {
      let runner = google.script.run
        .withSuccessHandler(res => resolve(res))
        .withFailureHandler(err => reject(err));

      if (action === 'checkPhoneStep1') runner.checkPhoneStep1(payload.phone);
      else if (action === 'checkPhoneStep2') runner.checkPhoneStep2(payload.phone, payload.password, payload.autoCreate);
      else if (action === 'getAllData') runner.getAllData(payload.idshop);
      else if (action === 'getProducts') runner.getProducts(payload.idshop);
      else if (action === 'getLogs') runner.getLogs(payload.idshop);
      else if (action === 'saveLog') runner.saveLog(payload.idshop, payload.log || payload);
      else if (action === 'saveProduct') runner.saveProduct(payload.idshop, payload.product || payload);
      else if (action === 'deleteProduct') runner.deleteProduct(payload.idshop, payload.id || payload.productId);
      else if (action === 'updateStore') runner.updateStore(payload.idshop, payload.name, payload.logo);
      else if (action === 'uploadFile') runner.uploadFile(payload.base64Data, payload.fileName);
      else if (action === 'getDashboard') runner.getDashboard(payload.idshop, payload.range);
      else if (action === 'checkVersion') {
        // Fallback for native GAS
        try { runner.getProductVersion(payload.idshop); } catch(e) { resolve({ success:true, version: Date.now().toString() }); }
      }
      else reject(new Error('Unknown native GAS action: ' + action));
    });
  } else {
    // REST API via fetch (GitHub Pages or standalone browser)
    try {
      const url = new URL(GAS_API_URL);
      let options = {};

      if (method === 'GET') {
        url.searchParams.append('action', action);
        Object.keys(payload).forEach(k => {
          if (payload[k] !== undefined && payload[k] !== null) {
            url.searchParams.append(k, payload[k]);
          }
        });
        options = { method: 'GET', mode: 'cors' };
      } else {
        const bodyObj = { action, ...payload };
        options = {
          method: 'POST',
          mode: 'cors',
          body: JSON.stringify(bodyObj),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' } // text/plain prevents CORS preflight issues on GAS
        };
      }

      const res = await fetch(url.toString(), options);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      return json;
    } catch (err) {
      console.error('API Error (' + action + '):', err);
      throw err;
    }
  }
}

/* ====================================================
   DOM UTILS & UI CONTROLS
==================================================== */
function ge(id){ return document.getElementById(id); }

function load(show, txt){
  ge('loader').style.display = show ? 'flex' : 'none';
  if(txt) ge('loader-txt').textContent = txt;
}

let _toastTimer = null;
function toast(type, msg){
  const el = ge('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type || '');
  if(_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = 'toast'; }, 2500);
}

function fmtNum(n){ return Number(n || 0).toLocaleString('th-TH'); }

function imgUrl(url){
  if(!url) return '';
  return url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
}

function showAlert(icon, title, msg, btnTxt, onClose){
  ge('alert-icon').innerHTML = icon;
  ge('alert-title').textContent = title;
  ge('alert-msg').innerHTML = msg || '';
  
  const logoutBtn = ge('alert-logout-btn');
  if(logoutBtn) {
    logoutBtn.style.display = (title.includes('ไม่สามารถใช้งาน') || title.includes('รอการอนุมัติ')) ? 'block' : 'none';
  }
  
  ge('alert-btn').textContent = btnTxt || 'ตกลง';
  ge('alert-wrap').classList.add('show');
  ge('alert-wrap')._onClose = onClose || null;
}

function closeAlert(){
  ge('alert-wrap').classList.remove('show');
  const cb = ge('alert-wrap')._onClose;
  if(cb){ ge('alert-wrap')._onClose = null; cb(); }
}

let _confirmCb = null;
function showConfirm(icon, title, msg, okTxt, okClass, cb){
  ge('confirm-icon').textContent = icon;
  ge('confirm-title').textContent = title;
  ge('confirm-msg').innerHTML = msg || '';
  ge('confirm-ok').textContent = okTxt || 'ยืนยัน';
  ge('confirm-ok').className = okClass || 'btn-confirm';
  ge('confirm-wrap').classList.add('show');
  _confirmCb = cb || null;
}

function closeConfirm(ok){
  ge('confirm-wrap').classList.remove('show');
  if(_confirmCb){ const cb = _confirmCb; _confirmCb = null; cb(ok); }
}

let _modalCb = null;
function openModal(title, bodyHtml, footerHtml, cb){
  ge('modal-title').innerHTML = title;
  ge('modal-body').innerHTML = bodyHtml;
  ge('modal-footer').innerHTML = footerHtml;
  ge('modal-wrap').classList.add('show');
  _modalCb = cb || null;
}

function closeModal(){
  ge('modal-wrap').classList.remove('show');
  _modalCb = null;
}

/* Image resize to optimize file size */
function resizeImg(file, cb){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxPx = 240, q = 0.6;
      let w = img.width, h = img.height;
      if(w > h ? w > maxPx : h > maxPx){
        if(w > h){ h = Math.round(h * maxPx / w); w = maxPx; }
        else{ w = Math.round(w * maxPx / h); h = maxPx; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(c.toDataURL('image/jpeg', q));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ====================================================
   BOOT, LOCAL STORAGE CACHING & FAST VERSION CHECK
==================================================== */
window.onload = function(){
  const savedPhone = localStorage.getItem('sp_phone');
  const savedPw = localStorage.getItem('sp_pw');
  const savedIdShop = localStorage.getItem('sp_idshop');

  if (savedPhone && savedPw) {
    S.phone = savedPhone;
    S.password = savedPw;
    S.idshop = savedIdShop || '';

    // 1. INSTANT LOAD: Load cached master data immediately if available
    const cachedProds = localStorage.getItem('sp_prods_' + S.idshop);
    const cachedStore = localStorage.getItem('sp_store_' + S.idshop);
    const cachedLogs  = localStorage.getItem('sp_logs_' + S.idshop);
    const cachedStaff = localStorage.getItem('sp_staff_' + S.idshop);

    if (cachedProds && cachedStore) {
      try {
        S.prods = JSON.parse(cachedProds);
        S.logs = cachedLogs ? JSON.parse(cachedLogs) : [];
        S.staff = cachedStaff ? JSON.parse(cachedStaff) : [];
        const storeInfo = JSON.parse(cachedStore);
        
        ge('login-screen').classList.remove('show');
        ge('app').classList.add('show');
        updateStoreUI(storeInfo, localStorage.getItem('sp_status_' + S.idshop) || 'Active');
        renderProds();
        renderLogs();
        renderStaff();
      } catch (err) {
        console.warn('Cache parse error', err);
      }
    }

    // 2. BACKGROUND VALIDATION / AUTH & VERSION CHECK
    load(!cachedProds, 'กำลังเชื่อมต่อระบบ...');
    apiCall('checkPhoneStep2', { phone: savedPhone, password: savedPw, autoCreate: false })
      .then(res => {
        load(false);
        onAuth(res);
      })
      .catch(err => {
        load(false);
        if (!cachedProds) {
          showAlert('&#x274C;', 'เกิดข้อผิดพลาด', err.message);
          ge('login-screen').classList.add('show');
        } else {
          toast('warn', 'โหมดออฟไลน์: กำลังใช้ข้อมูลที่บันทึกไว้');
        }
      });
  } else {
    ge('login-screen').classList.add('show');
  }
};

/* ====================================================
   LOGIN FLOW (2-Step Verification)
==================================================== */
let currentLoginStep = 1;
let isNewAccount = false;

async function doLogin(){
  const phoneInput = ge('inp-phone').value.replace(/\D/g, '');
  if(phoneInput.length < 9){ toast('warn', 'กรุณากรอกเบอร์โทรให้ครบ'); return; }
  
  if (currentLoginStep === 1) {
    load(true, 'กำลังตรวจสอบบัญชี...');
    try {
      const res = await apiCall('checkPhoneStep1', { phone: phoneInput });
      load(false);
      ge('pw-wrapper').style.display = 'block';
      ge('inp-phone').readOnly = true;
      
      if (res.exists) {
        isNewAccount = false;
        ge('lbl-pw').textContent = 'ใส่รหัสผ่านเพื่อเข้าใช้งาน';
        ge('login-status-msg').textContent = 'พบเบอร์โทรศัพท์ในระบบ กรุณากรอกรหัสผ่าน';
        ge('login-status-msg').style.color = 'var(--pri)';
        ge('btn-login-action').textContent = 'เข้าสู่ระบบ';
      } else {
        isNewAccount = true;
        ge('lbl-pw').textContent = 'ตั้งรหัสผ่านสำหรับบัญชีใหม่';
        ge('login-status-msg').textContent = 'ไม่พบเบอร์นี้ในระบบ กรุณาตั้งรหัสผ่านเพื่อสมัครใช้งานใหม่';
        ge('login-status-msg').style.color = 'var(--amb)';
        ge('btn-login-action').textContent = 'สร้างบัญชีผู้ใช้ใหม่';
      }
      currentLoginStep = 2;
      setTimeout(() => { ge('inp-pw').focus(); }, 100);
    } catch(e) {
      load(false);
      showAlert('&#x274C;', 'เกิดข้อผิดพลาด', e.message);
    }
  } else if (currentLoginStep === 2) {
    const pwInput = ge('inp-pw').value.trim();
    if(!pwInput){ toast('warn', 'กรุณากรอกรหัสผ่าน'); return; }
    
    S.phone = phoneInput;
    S.password = pwInput;
    load(true, 'กำลังยืนยันตัวตน...');
    try {
      const res = await apiCall('checkPhoneStep2', { phone: phoneInput, password: pwInput, autoCreate: isNewAccount });
      onAuth(res);
    } catch(e) {
      load(false);
      showAlert('&#x274C;', 'เกิดข้อผิดพลาด', e.message);
    }
  }
}

function onAuth(res){
  load(false);
  if (res.success === false) {
    showAlert('&#x274C;', 'ล็อกอินไม่สำเร็จ', res.msg);
    if (res.msg && res.msg.includes('ถูกลบแล้ว')) {
      clearLocalCache();
    }
    return;
  }
  
  S.idshop    = res.idshop;
  S.active    = res.active;
  S.daysLeft  = res.daysLeft || 0;
  S.expireStr = res.expireStr || '-';
  S.blockUI   = !res.active;
  
  // Save credentials and cache
  localStorage.setItem('sp_phone', S.phone);
  localStorage.setItem('sp_pw', S.password);
  localStorage.setItem('sp_idshop', S.idshop);
  localStorage.setItem('sp_status_' + S.idshop, res.status || '');
  if (res.storeInfo) localStorage.setItem('sp_store_' + S.idshop, JSON.stringify(res.storeInfo));
  if (res.version) localStorage.setItem('sp_ver_' + S.idshop, res.version);

  ge('login-screen').classList.remove('show');
  ge('app').classList.add('show');
  
  updateStoreUI(res.storeInfo, res.status);
  updateExpireBadge();
  
  if(res.allData){
    S.prods = res.allData.products || [];
    S.logs  = res.allData.logs || [];
    S.staff = res.allData.staff || [];
    localStorage.setItem('sp_prods_' + S.idshop, JSON.stringify(S.prods));
    localStorage.setItem('sp_logs_' + S.idshop, JSON.stringify(S.logs));
    localStorage.setItem('sp_staff_' + S.idshop, JSON.stringify(S.staff));
    renderLogs();
    renderProds();
    renderStaff();
  }
  
  if(res.active){
    ge('fab').style.display = 'flex';
    if (!res.found) {
      showAlert('&#x1F389;', 'ยินดีต้อนรับสู่ Build Brand', 'คุณสามารถทดลองใช้งานระบบได้ 30 วัน<br>สำหรับบันทึกรับเข้า-เบิกออกวัตถุดิบอาหารและดูแดชบอร์ดสรุป', 'เริ่มใช้งาน');
    } else {
      checkExpireAlert(res.daysLeft, res.expireStr);
    }
  } else {
    ge('fab').style.display = 'none';
    let alertTitle = 'ไม่สามารถใช้งานได้';
    let alertMsg = 'สิทธิ์ของคุณหมดอายุแล้ว<br>สามารถดูข้อมูลได้ แต่ไม่สามารถแก้ไขหรือเพิ่มข้อมูลได้';
    if (res.status === 'Pending') {
      alertTitle = 'รอการอนุมัติ';
      alertMsg = 'เบอร์ของคุณยังไม่ได้รับการเปิดใช้งาน<br>กรุณาติดต่อผู้ดูแลระบบ';
    }
    showAlert('&#x1F512;', alertTitle, alertMsg);
  }
}

function clearLocalCache() {
  localStorage.removeItem('sp_phone');
  localStorage.removeItem('sp_pw');
  localStorage.removeItem('sp_idshop');
  if (S.idshop) {
    localStorage.removeItem('sp_prods_' + S.idshop);
    localStorage.removeItem('sp_logs_' + S.idshop);
    localStorage.removeItem('sp_staff_' + S.idshop);
    localStorage.removeItem('sp_store_' + S.idshop);
    localStorage.removeItem('sp_ver_' + S.idshop);
  }
}

function doLogout() {
  clearLocalCache();
  load(true, 'กำลังออกจากระบบ...');
  setTimeout(() => {
    window.location.reload();
  }, 300);
}

function actionGuard(){
  if(S.blockUI){
    showAlert('&#x1F512;', 'ไม่สามารถใช้งานได้', 'สิทธิ์ของคุณหมดอายุแล้ว ไม่สามารถแก้ไขหรือเพิ่มข้อมูลได้');
    return true;
  }
  return false;
}

function checkExpireAlert(days, expStr){
  if(days <= 0) return;
  let icon, msg;
  if(days === 1)     { icon = '&#x26A0;&#xFE0F;'; msg = 'รหัสของคุณจะหมดอายุ<b>วันนี้</b>!'; }
  else if(days <= 3) { icon = '&#x26A0;&#xFE0F;'; msg = 'รหัสจะหมดอายุใน <b>' + days + ' วัน</b> (' + expStr + ')'; }
  else if(days <= 7) { icon = '&#x2139;&#xFE0F;';  msg = 'รหัสจะหมดอายุใน <b>' + days + ' วัน</b> (' + expStr + ')'; }
  if(msg) setTimeout(() => { showAlert(icon, 'แจ้งเตือนการหมดอายุ', msg, 'รับทราบ'); }, 800);
}

function updateExpireBadge(){
  ge('expire-badge').style.display = 'none';
}

/* ====================================================
   STORE UI
==================================================== */
function updateStoreUI(si, status){
  if(!si) return;
  const nm = si.name || 'ร้านอาหารของฉัน';
  if(ge('store-name')) ge('store-name').textContent = nm;
  if(ge('set-store-name')) ge('set-store-name').textContent = nm;
  if(ge('set-expire-txt')) ge('set-expire-txt').textContent = 'หมดอายุ: ' + S.expireStr + (S.daysLeft > 0 ? ' (' + S.daysLeft + ' วัน)' : '');
  const init = nm.charAt(0).toUpperCase();
  const initEl = ge('store-init');
  if(initEl) initEl.textContent = init;
  
  const av = ge('store-av');
  if(av){
    if(si.logo){
      av.innerHTML = '<img src="' + si.logo + '" onerror="this.parentNode.innerHTML=\'<span id=\\\'store-init\\\'>' + init + '</span>\'">';
    } else {
      av.innerHTML = '<span id="store-init">' + init + '</span>';
    }
  }

  const statusEl = ge('set-store-status');
  if (statusEl) {
    if (status === 'trial' || status === 'Trial') {
      statusEl.innerHTML = '<span style="color:var(--red); font-weight:normal;">(บัญชีทดลอง)</span>';
    } else if (status === 'Active' || status === 'active') {
      statusEl.innerHTML = '<span style="color:var(--grn); font-weight:normal;">(ใช้งานปกติ)</span>';
    } else {
      statusEl.innerHTML = '';
    }
  }
}

function switchPage(p){
  const pages = ['stock', 'dash'];
  for(let i = 0; i < pages.length; i++){
    ge('page-' + pages[i]).classList.toggle('active', pages[i] === p);
    ge('nav-' + pages[i]).classList.toggle('on', pages[i] === p);
  }
  
  if(ge('fab')) {
    ge('fab').style.display = (p === 'stock' && S.active) ? 'flex' : 'none';
  }
  
  if(p === 'dash'){ renderDash(); }
}

==================================================== */
function filterByType(t){
  S.filterType = S.filterType === t ? 'ALL' : t;
  ge('f-type').value = S.filterType;
  
  if (S.filterType !== 'ALL' && !S.filterDate) {
    const d = new Date();
    const day = ('0' + d.getDate()).slice(-2);
    const m = ('0' + (d.getMonth() + 1)).slice(-2);
    S.filterDate = d.getFullYear() + '-' + m + '-' + day;
    ge('f-date').value = S.filterDate;
  }
  
  ge('stat-in').classList.toggle('sel', S.filterType === 'IN');
  ge('stat-out').classList.toggle('sel', S.filterType === 'OUT');
  renderLogs();
}

/* ====================================================
   RENDER TRANSACTION LOGS
==================================================== */
function renderLogs(){
  const targetDateObj = S.filterDate ? new Date(S.filterDate) : new Date();
  const targetMatch = targetDateObj.toDateString();
  
  let lblStr = 'วันนี้';
  if(S.filterDate) {
    const dd = ('0' + targetDateObj.getDate()).slice(-2);
    const mm = ('0' + (targetDateObj.getMonth() + 1)).slice(-2);
    lblStr = dd + '/' + mm + '/' + targetDateObj.getFullYear();
  }
  
  ge('lbl-in').textContent = S.filterDate ? 'วันที่ ' + lblStr : 'รับเข้าวันนี้';
  ge('lbl-out').textContent = S.filterDate ? 'วันที่ ' + lblStr : 'เบิกออกวันนี้';

  let sIn = 0, sOut = 0;
  for(let i = 0; i < S.logs.length; i++){
    const l = S.logs[i];
    if(l.rawDate && new Date(l.rawDate).toDateString() === targetMatch){
      if(l.type === 'IN') sIn++;
      if(l.type === 'OUT') sOut++;
    }
  }
  ge('sum-in').textContent  = sIn;
  ge('sum-out').textContent = sOut;

  let rows = S.logs.slice();
  if(S.filterType !== 'ALL') rows = rows.filter(l => l.type === S.filterType);
  if(S.filterDate){
    const fd = new Date(S.filterDate).toDateString();
    rows = rows.filter(l => l.rawDate && new Date(l.rawDate).toDateString() === fd);
  }

  ge('log-count').textContent = rows.length ? rows.length + ' รายการ' : '';
  const el = ge('log-list');
  if(!rows.length){
    el.innerHTML = '<div class="empty"><div class="empty-ic">&#x1F4CB;</div><p>ไม่มีรายการ</p></div>';
    return;
  }
  
  let html = '';
  for(let j = 0; j < rows.length; j++){
    const l = rows[j];
    const isIn = l.type === 'IN';
    const _lsrc = l.img || '';
    html += '<div class="log-item">'
      + '<div class="log-ic ' + (isIn ? 'in' : 'out') + '">'
      + (_lsrc ? '<img src="' + _lsrc + '" style="width:100%;height:100%;object-fit:cover;border-radius:10px" onerror="this.style.display=\'none\'">' : (isIn ? '&#x1F4E5;' : '&#x1F4E4;'))
      + '</div>'
      + '<div class="log-body">'
      + '<div class="log-name">' + l.item + '</div>'
      + '<div class="log-meta">' + l.date + (l.staff ? ' &middot; ' + l.staff : '') + '</div>'
      + '</div>'
      + '<div class="log-right">'
      + '<div class="log-qty ' + (isIn ? 'in' : 'out') + '">' + (isIn ? '+' : '-') + fmtNum(l.qty) + '</div>'
      + (l.price ? '<div class="log-price">' + fmtNum(l.price) + ' บ./หน่วย</div>' : '')
      + '</div>'
      + '</div>';
  }
  el.innerHTML = html;
}

function onProdChange(sel){
  if(!sel) sel = ge('m-item');
  if(!sel) return;
  const opt = sel.options[sel.selectedIndex];
  const prev = ge('m-prev');
  const priceEl = ge('m-price');
  if(prev && opt.getAttribute('data-img')){
    prev.src = opt.getAttribute('data-img');
    prev.style.display = 'block';
  } else if(prev && prev.tagName === 'IMG') {
    prev.style.display = 'none';
  }
  if(priceEl) priceEl.value = opt.getAttribute('data-price') || '';
}

function onTypeChange() {
  const typeEl = ge('m-type');
  const priceEl = ge('m-price');
  if(!typeEl || !priceEl) return;
  
  if(typeEl.value === 'OUT') {
    priceEl.readOnly = true;
    priceEl.style.backgroundColor = 'var(--bg)';
    priceEl.style.color = 'var(--txt2)';
  } else {
    priceEl.readOnly = false;
    priceEl.style.backgroundColor = '#fff';
    priceEl.style.color = 'var(--txt)';
  }
}

async function submitLog(){
  const qty = ge('m-qty') ? ge('m-qty').value : '';
  if(!qty || Number(qty) <= 0){ toast('warn', 'กรุณากรอกจำนวนให้ถูกต้อง'); return; }
  
  const submitBtn = ge('btn-submit-log');
  if (submitBtn) submitBtn.disabled = true;

  const obj = {
    item:  ge('m-item').value,
    type:  ge('m-type').value,
    qty:   Number(qty),
    price: Number(ge('m-price').value) || 0,
    staff: ge('m-staff').value
  };
  
  closeModal();
  load(true, 'กำลังบันทึกรายการ...');

  try {
    const d = await apiCall('saveLog', { idshop: S.idshop, log: obj });
    load(false);
    const data = d.allData || d;
    S.prods = data.products || S.prods;
    S.logs = data.logs || S.logs;

}

function submitStore(){

        if(ge('store-av')) ge('store-av').innerHTML = '<img src="' + b64 + '" style="width:100%;height:100%;object-fit:cover;">';

          load(false);

    load(true, 'กำลังบันทึก...');

}

function submitProduct(id){
  const name = ge('p-name') ? ge('p-name').value.trim() : '';
  if(!name){ toast('warn', 'กรุณากรอกชื่อสินค้า'); return; }
  const file = ge('p-img') ? ge('p-img').files[0] : null;
  let p = null;
  for(let i = 0; i < S.prods.length; i++) if(S.prods[i].id === id){ p = S.prods[i]; break; }
  const existImg = p ? p.img || '' : '';

  const obj = { id: id, name: name, price: Number(ge('p-price').value) || 0, unit: ge('p-unit').value, img: existImg };
  closeModal();

  if(file){
    load(true, 'กำลังอัปโหลดรูป...');
    resizeImg(file, async function(b64){
      try {
        const upRes = await apiCall('uploadFile', { base64Data: b64, fileName: file.name });
        const url = upRes.url || upRes;
        if(typeof url === 'string' && url.indexOf('error') === 0){
          load(false);
          showAlert('&#x274C;', 'อัปโหลดไม่สำเร็จ', url);
          return;
        }
        obj.img = url;
        const res = await apiCall('saveProduct', { idshop: S.idshop, product: obj });
        load(false);
        const allData = res.allData || res;
        S.prods = allData.products || allData;
        if (allData.logs) S.logs = allData.logs;
        S.dashCache = null;
        localStorage.setItem('sp_prods_' + S.idshop, JSON.stringify(S.prods));
        renderProds();
        renderLogs();
        toast('ok', id ? 'แก้ไขสำเร็จ' : 'เพิ่มสำเร็จ');
      } catch(e) {
        load(false);
        showAlert('&#x274C;', 'ผิดพลาด', e.message);
      }
    });
  } else {
    load(true, 'กำลังบันทึก...');
    apiCall('saveProduct', { idshop: S.idshop, product: obj })
      .then(res => {
        load(false);
        const allData = res.allData || res;
        S.prods = allData.products || allData;
        if (allData.logs) S.logs = allData.logs;
        S.dashCache = null;
        localStorage.setItem('sp_prods_' + S.idshop, JSON.stringify(S.prods));
        renderProds();
        renderLogs();
        toast('ok', id ? 'แก้ไขสำเร็จ' : 'เพิ่มสำเร็จ');
      })
      .catch(e => {
        load(false);
        showAlert('&#x274C;', 'ผิดพลาด', e.message);
      });
  }
}

    body = '<div style="font-size:14px; line-height:1.6; color:var(--txt2);">' +
           '<p style="margin-bottom:12px;"><strong style="color:var(--txt); font-size:15px;">เกณฑ์การแสดงผล</strong><br>ระบบจะแสดงวัตถุดิบที่ <span style="color:var(--pri); font-weight:bold;">สต็อกคงเหลือน้อยกว่า 2 เท่า</span> ของยอดที่ถูกเบิกออกไปทำอาหารในช่วงเวลาที่คุณเลือก</p>' +
           '<p><strong style="color:var(--txt); font-size:15px;">ตัวเลข "แนะนำ +..."</strong><br>คือจำนวนขั้นต่ำที่ระบบแนะนำให้สั่งซื้อมาเติมสต็อก เพื่อให้เพียงพอกับอัตราการใช้ในรอบถัดไป</p>' +
           '</div>';
    openModal('&#x2139;&#xFE0F; ข้อมูลแนะนำสั่งซื้อ', body, '<button class="btn-cancel" style="width:100%" onclick="closeModal()">ปิดหน้าต่าง</button>', null);
  } else if (type === 'stock') {
    body = '<div style="font-size:14px; line-height:1.6; color:var(--txt2);">' +
           '<p style="margin-bottom:12px;"><strong style="color:var(--txt); font-size:15px;">ความหมายของแถบสี</strong><br>' +
           '<span style="color:var(--grn); font-size:18px;">&#x25A0;</span> <strong style="color:var(--grn)">สีเขียว:</strong> ปลอดภัย (มี 5 หน่วยขึ้นไป)<br>' +
           '<span style="color:var(--amb); font-size:18px;">&#x25A0;</span> <strong style="color:var(--amb)">สีเหลือง:</strong> ใกล้หมด (น้อยกว่า 5 หน่วย)<br>' +
           '<span style="color:var(--red); font-size:18px;">&#x25A0;</span> <strong style="color:var(--red)">สีแดง:</strong> หมดสต็อก (0 หน่วยหรือติดลบ)</p>' +
           '<p><strong style="color:var(--txt); font-size:15px;">ความยาวของแถบ</strong><br>วัดสัดส่วนเปรียบเทียบกับวัตถุดิบที่มีปริมาณในสต็อกมากที่สุดในร้าน</p>' +
           '</div>';
    openModal('&#x2139;&#xFE0F; ข้อมูลสต็อกคงเหลือ', body, '<button class="btn-cancel" style="width:100%" onclick="closeModal()">ปิดหน้าต่าง</button>', null);
  }
}

function applyDashFilter(){
  S.dashCache = null; 
  renderDash();
}

function resetDashFilter(){
  ge('d-range').value = 'thismonth';
  applyDashFilter();
}

async function renderDash(){
  if(S.dashCache){ renderDashData(S.dashCache); return; }
  const range = ge('d-range') ? ge('d-range').value : 'thismonth';
  load(true, 'กำลังวิเคราะห์ข้อมูลสต็อก...');
  try {
    const res = await apiCall('getDashboard', { idshop: S.idshop, range: range });
    load(false);
    const d = res.dashboard || res;
    S.dashCache = d;
    renderDashData(d);
  } catch(e) {
    load(false);
    showAlert('&#x274C;', 'ผิดพลาด', e.message);
  }
}

function renderDashData(d){
  let maxStock = 1;
  for(let i = 0; i < d.stockList.length; i++) {
    if(d.stockList[i].stock > maxStock) maxStock = d.stockList[i].stock;
  }

  let sugHtml = '';
  if(d.suggestions && d.suggestions.length){
    sugHtml = '<div class="sec-hd" style="margin-top:4px;">'
           + '<div style="display:flex; align-items:center; gap:6px;">'
           + '<h3 style="margin:0;">&#x26A0;&#xFE0F; แนะนำสั่งซื้อ</h3>'
           + '<button onclick="showHelp(\'suggest\')" style="background:none; border:none; color:var(--txt3); display:flex; align-items:center; padding:0;">'
           + '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></button>'
           + '</div></div>';
           
    for(let i = 0; i < d.suggestions.length; i++){
      const sg = d.suggestions[i];
      sugHtml += '<div class="suggest-row">'
        + '<div><div style="font-size:14px;font-weight:600;color:#92400e">' + sg.name + '</div>'
        + '<div style="font-size:12px;color:#92400e">คงเหลือ ' + sg.stock + ' ' + (sg.unit || '') + '</div></div>'
        + '<div style="font-size:14px;font-weight:700;color:var(--amb)">แนะนำ +' + sg.suggest + ' ' + (sg.unit || '') + '</div>'
        + '</div>';
    }
  }

  let sortedList = d.stockList.slice();
  if (currentDashSort === 'stock_asc') {
    sortedList.sort((a, b) => a.stock - b.stock);
  } else if (currentDashSort === 'stock_desc') {
    sortedList.sort((a, b) => b.stock - a.stock);
  } else if (currentDashSort === 'out_desc') {
    sortedList.sort((a, b) => b.outFreq - a.outFreq);
  } else if (currentDashSort === 'out_asc') {
    sortedList.sort((a, b) => a.outFreq - b.outFreq);
  }

  const icUp = '&#x25B2;', icDown = '&#x25BC;', icDual = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle"><polyline points="7 15 12 20 17 15"></polyline><polyline points="7 9 12 4 17 9"></polyline></svg>';
  const stockIcon = currentDashSort === 'stock_asc' ? icUp : (currentDashSort === 'stock_desc' ? icDown : icDual);
  const outIcon = currentDashSort === 'out_asc' ? icUp : (currentDashSort === 'out_desc' ? icDown : icDual);
  const btnStockClass = currentDashSort.startsWith('stock') ? 'btn-pri' : 'btn-ghost';
  const btnOutClass = currentDashSort.startsWith('out') ? 'btn-pri' : 'btn-ghost';

  const sortButtonsHtml = '<div style="display:flex; gap:8px; margin:10px 0 14px; flex-wrap:wrap;">'
    + '<button class="btn-sm ' + btnStockClass + '" onclick="toggleDashSort(\'stock\')" style="padding:6px 12px; font-size:12px; display:flex; align-items:center; gap:5px;">วัตถุดิบคงเหลือ <span>' + stockIcon + '</span></button>'
    + '<button class="btn-sm ' + btnOutClass + '" onclick="toggleDashSort(\'out\')" style="padding:6px 12px; font-size:12px; display:flex; align-items:center; gap:5px;">เบิกใช้บ่อยสุด <span>' + outIcon + '</span></button>'
    + '</div>';

  let stockHtml = '';
  for(let j = 0; j < sortedList.length; j++){
    const st = sortedList[j];
    const pct = Math.max(0, Math.min(100, Math.round(st.stock / maxStock * 100)));
    const clr = st.stock <= 0 ? 'var(--red)' : st.stock < 5 ? 'var(--amb)' : 'var(--grn)';
    const simg = st.img ? (st.img.indexOf('?') >= 0 ? st.img + '&t=' + Date.now() : st.img + '?t=' + Date.now()) : 'https://via.placeholder.com/38';
    
    stockHtml += '<div class="stock-row">'
      + '<img class="stock-thumb" src="' + simg + '" onerror="this.src=\'https://via.placeholder.com/38\'">'
      + '<div class="sbw">'
      + '<div class="sbl"><span>' + st.name + '</span><span style="color:' + clr + '">คงเหลือ ' + fmtNum(st.stock) + ' ' + (st.unit || '') + '</span></div>'
      + '<div class="sbb"><div class="sbf" style="width:' + pct + '%;background:' + clr + '"></div></div>'
      + '<div style="font-size:11px;color:var(--txt3);margin-top:3px">เบิกไปทำอาหาร ' + fmtNum(st.outFreq) + ' ' + (st.unit || '') + '</div>'
      + '</div>'
      + '</div>';
  }

  const stockHeaderHtml = '<div class="sec-hd" style="margin-top:14px; margin-bottom: 2px;">'
    + '<div style="display:flex; align-items:center; gap:6px;">'
    + '<h3 style="margin:0;">&#x1F4E6; สต็อกวัตถุดิบคงเหลือ</h3>'
    + '<button onclick="showHelp(\'stock\')" style="background:none; border:none; color:var(--txt3); display:flex; align-items:center; padding:0;">'
    + '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></button>'
    + '</div></div>';

  ge('dash-body').innerHTML =
    '<div class="dash-grid">'
    + '<div class="dash-card" style="position:relative;"><h4>รับเข้า (ซื้อเข้า)</h4><div class="dash-big c-pri">' + fmtNum(d.costIn) + ' <span style="font-size:16px;font-weight:400;color:var(--txt3)">บ.</span></div><div class="dash-sub">รวม ' + fmtNum(d.totIn) + ' รายการ</div><button onclick="openChart(\'IN\')" style="position:absolute;top:14px;right:16px;background:var(--pri-l);color:var(--pri);border:none;padding:5px 8px;border-radius:6px;font-size:11px;font-weight:700;">ดูกราฟ</button></div>'
    + '<div class="dash-card" style="position:relative;"><h4>เบิกออก (ใช้ทำอาหาร)</h4><div class="dash-big c-red">' + fmtNum(d.costOut) + ' <span style="font-size:16px;font-weight:400;color:var(--txt3)">บ.</span></div><div class="dash-sub">รวม ' + fmtNum(d.totOut) + ' รายการ</div><button onclick="openChart(\'OUT\')" style="position:absolute;top:14px;right:16px;background:var(--red-l);color:var(--red);border:none;padding:5px 8px;border-radius:6px;font-size:11px;font-weight:700;">ดูกราฟ</button></div>'
    + '</div>'
    + sugHtml
    + stockHeaderHtml
    + sortButtonsHtml
    + stockHtml;
}

function openChart(type) {
  const d = S.dashCache;
  if(!d || !d.chart) return;
  ge('chart-title').textContent = type === 'IN' ? 'กราฟมูลค่าซื้อวัตถุดิบรับเข้า' : 'กราฟมูลค่าเบิกวัตถุดิบไปใช้';
  ge('chart-modal').classList.add('show');
  
  const ctx = document.getElementById('myChart').getContext('2d');
  if(myChartInstance) myChartInstance.destroy();
  
  const clr = type === 'IN' ? '#1d75bb' : '#dc2626';
  const clrBg = type === 'IN' ? 'rgba(29, 117, 187, 0.2)' : 'rgba(220, 38, 38, 0.2)';
  const dataVals = type === 'IN' ? d.chart.inCost : d.chart.outCost;

  myChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: d.chart.labels,
      datasets: [{
        label: 'มูลค่า (บาท)',
        data: dataVals,
        backgroundColor: clrBg,
        borderColor: clr,
        borderWidth: 1.5,
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: { beginAtZero: true, ticks: { font: { family: 'Sarabun' } } },
        x: { ticks: { font: { family: 'Sarabun' } } }
      },
      plugins: {
        legend: { labels: { font: { family: 'Sarabun' } } }
      }
    }
  });
}

function closeChart() { ge('chart-modal').classList.remove('show'); }
</script>
</body>
</html>
